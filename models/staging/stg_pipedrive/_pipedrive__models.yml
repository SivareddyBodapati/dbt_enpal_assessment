# The test here in this yml file represents generic test, we can addd singular test as custom sql file in the tests/name.sql file
version: 2

models:
  - name: stg_pipedrive__activities
    description: Staging model for Pipedrive activities
    columns:
      - name: activity_id
        data_tests:
          - not_null

  - name: stg_pipedrive__activity_types
    description: Staging model for Pipedrive activity types
    columns:
      - name: activity_type
        data_tests:
          - not_null
          - unique
          
  - name: stg_pipedrive__deal_changes
    description: Staging model for Pipedrive deal changes
    columns:
      - name: changed_at
        data_tests:
          - not_null
      - name: deal_id
        data_tests:
          - not_null

  - name: stg_pipedrive__fields
    description: Staging model for Pipedrive fields
    columns:
      - name: field_id
        data_tests:
          - not_null
          - unique
      - name: field_name
        data_tests:
          - not_null

  - name: stg_pipedrive__stages
    description: Staging model for Pipedrive stages
    columns:
      - name: stage_id
        data_tests:
          - not_null
          - unique

  - name: stg_pipedrive__users
    description: Staging model for Pipedrive users
